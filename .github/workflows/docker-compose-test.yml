name: Test Docker Compose Setup

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=testuser
          POSTGRES_PASSWORD=testpassword123
          POSTGRES_DB=testdb
          N8N_ENCRYPTION_KEY=$(openssl rand -hex 32)
          N8N_USER_MANAGEMENT_JWT_SECRET=$(openssl rand -hex 32)
          OLLAMA_HOST=ollama:11434
          EOF

      - name: Create shared directory
        run: mkdir -p shared

      - name: Validate docker-compose.yml
        run: |
          docker compose config > /dev/null
          echo "docker-compose.yml is valid!"

      - name: Start services with CPU profile
        run: |
          docker compose --profile cpu up -d

      - name: Wait for PostgreSQL to be healthy
        run: |
          echo "Waiting for PostgreSQL to be healthy..."
          timeout 120 bash -c 'until docker compose ps postgres | grep -q "healthy"; do sleep 2; done' || (echo "PostgreSQL health check failed. Logs:"; docker compose logs postgres; exit 1)
          echo "PostgreSQL is healthy!"

      - name: Check n8n-import files accessibility
        run: |
          echo "Checking if demo-data files exist locally..."
          ls -la n8n/demo-data/credentials/ || echo "Credentials directory not found"
          ls -la n8n/demo-data/workflows/ || echo "Workflows directory not found"
          echo ""
          echo "Note: docker-compose mounts ./n8n/demo-data to /demo-data in container"
          echo "If import fails, the path in docker-compose.yml might need to be /demo-data/credentials"

      - name: Debug n8n-import container (if still running)
        continue-on-error: true
        run: |
          if docker compose ps n8n-import | grep -q "Up\|starting"; then
            echo "Container is still running, checking paths..."
            echo "Checking /demo-data mount:"
            docker compose exec -T n8n-import ls -la /demo-data/ 2>&1 || true
            echo ""
            echo "Checking if n8n/demo-data path exists (relative to working dir):"
            docker compose exec -T n8n-import sh -c "ls -la n8n/demo-data/ 2>&1 || echo 'Path does not exist'" || true
            echo ""
            echo "Current working directory:"
            docker compose exec -T n8n-import pwd || true
          fi

      - name: Wait for n8n-import to complete
        run: |
          echo "Waiting for n8n-import to complete..."
          set +e
          timeout 300 bash -c 'until docker compose ps n8n-import | grep -q "Exited"; do 
            echo "Still waiting for n8n-import... ($(date))"
            docker compose logs --tail=10 n8n-import 2>&1 | tail -5
            sleep 5
          done'
          
          # Get the actual exit code
          CONTAINER_STATUS=$(docker compose ps n8n-import | grep "Exited" || echo "")
          set -e
          
          if echo "$CONTAINER_STATUS" | grep -q "Exited (0)"; then
            echo "✅ n8n-import completed successfully!"
          else
            echo "❌ === n8n-import FAILED ==="
            echo "Container status: $CONTAINER_STATUS"
            echo ""
            echo "=== Full n8n-import logs ==="
            docker compose logs n8n-import || true
            echo ""
            echo "=== All service status ==="
            docker compose ps
            echo ""
            echo "=== PostgreSQL connection test ==="
            docker compose exec -T postgres pg_isready -U testuser -d testdb || true
            exit 1
          fi

      - name: Wait for n8n to start
        run: |
          echo "Waiting for n8n to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:5678/healthz 2>/dev/null || docker compose ps n8n | grep -q "Up"; do sleep 5; done'
          echo "n8n is running!"

      - name: Wait for Qdrant to be ready
        run: |
          echo "Waiting for Qdrant to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:6333/health 2>/dev/null; do sleep 2; done'
          echo "Qdrant is ready!"

      - name: Wait for Ollama to be ready
        run: |
          echo "Waiting for Ollama to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:11434/api/tags 2>/dev/null; do sleep 2; done'
          echo "Ollama is ready!"
        continue-on-error: true

      - name: Test PostgreSQL connection
        run: |
          docker compose exec -T postgres pg_isready -U testuser -d testdb
          echo "PostgreSQL connection test passed!"

      - name: Test Qdrant API
        run: |
          curl -f http://localhost:6333/collections
          echo "Qdrant API test passed!"

      - name: Test Ollama API
        run: |
          curl -f http://localhost:11434/api/tags
          echo "Ollama API test passed!"
        continue-on-error: true

      - name: Test n8n health endpoint
        run: |
          # n8n might take a while to fully start, so we'll try the health endpoint
          # or check if the service is running
          if curl -f http://localhost:5678/healthz 2>/dev/null; then
            echo "n8n health endpoint accessible!"
          else
            echo "Checking n8n service status..."
            docker compose ps n8n
            docker compose logs --tail=50 n8n
            # Even if health endpoint isn't available, check if service is running
            docker compose ps n8n | grep -q "Up" || exit 1
            echo "n8n service is running!"
          fi

      - name: Check service status
        run: |
          echo "=== Service Status ==="
          docker compose ps
          echo ""
          echo "=== Service Logs (last 20 lines) ==="
          docker compose logs --tail=20

      - name: Cleanup
        if: always()
        run: |
          docker compose --profile cpu down -v
